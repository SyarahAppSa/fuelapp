# STAGING ONLY: plain-HTTP copy of the site for a preview tunnel that already provides HTTPS. Not mounted in production.
server {
  listen 8088;
  server_name _;
  root /usr/share/nginx/html;


  client_max_body_size 11m;

  # Security headers for the dashboard pages are set in "location /". API answers carry the API's own headers
  # (nginx would otherwise duplicate them, because add_header at server level is inherited by every location).

  location /api/auth/ {
    limit_req zone=auth burst=20 nodelay;
    limit_req_status 429;
    include /etc/nginx/proxy_api.conf;
  }
  location /api/ {
    limit_req zone=api burst=40 nodelay;
    limit_req_status 429;
    include /etc/nginx/proxy_api.conf;
  }
  location = /health { include /etc/nginx/proxy_api.conf; }      # public liveness (uptime monitors)
  location = /health/ready {                                      # readiness details: only from the server itself / private networks
    allow 127.0.0.1; allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16; deny all;
    include /etc/nginx/proxy_api.conf;
  }
  # Browser build of the driver app for testers (mounted only by docker-compose.staging.yml; absent in production → 404).
  # Flutter web needs WebAssembly ('wasm-unsafe-eval'); everything else is served from this site only.
  location /driver/ {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /driver/index.html;
  }
  location /swagger { return 404; }                               # API explorer never exposed publicly
  location ~ /\. { return 404; }                                  # no dotfiles
  location / {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    try_files $uri /index.html;
  }
}
