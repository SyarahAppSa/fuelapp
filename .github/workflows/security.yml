# Runs on every push / pull request and weekly. A release must not ship while any job is red.
name: security

on:
  push:
  pull_request:
  schedule: [{ cron: "17 3 * * 1" }]   # weekly: catches newly published vulnerabilities in unchanged code

permissions:
  contents: read
  security-events: write

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: ci-only }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=localhost;Database=fuelup;Username=fuelup_app;Password=ci_app
      ConnectionStrings__Migrations: Host=localhost;Database=fuelup;Username=fuelup_owner;Password=ci_owner
      RateLimits__AuthPerMinute: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Unit tests
        run: cd backend && dotnet test
      - name: Vulnerable NuGet packages (fails on any)
        run: |
          cd backend && dotnet list package --vulnerable --include-transitive | tee vuln.txt
          ! grep -q "has the following vulnerable packages" vuln.txt
      - name: Database roles
        env: { PGPASSWORD: ci-only }
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE fuelup_owner LOGIN PASSWORD 'ci_owner'" -c "CREATE ROLE fuelup_app LOGIN PASSWORD 'ci_app' NOBYPASSRLS" \
               -c "CREATE DATABASE fuelup OWNER fuelup_owner" -c "GRANT CONNECT ON DATABASE fuelup TO fuelup_app"
          psql -h localhost -U postgres -d fuelup -c "ALTER SCHEMA public OWNER TO fuelup_owner" -c "REVOKE CREATE ON SCHEMA public FROM PUBLIC"
      - name: API + functional and security test suites
        env:
          DB_OWNER_USER: fuelup_owner
          DB_OWNER_PASSWORD: ci_owner
          DB_APP_PASSWORD: ci_app
        run: |
          cd backend/src/FuelUp.Api && (dotnet run --launch-profile http > ../../../api.log 2>&1 &)
          for i in $(seq 1 90); do curl -sf localhost:5004/health && break; sleep 2; done
          cd ../../../tests && node e2e.mjs && node concurrency.mjs && sleep 61 && node security.mjs && sleep 61 && npx -y playwright@1 install chromium >/dev/null && node web-functional.mjs
      - if: failure()
        run: tail -200 api.log

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd web && npm ci
      - name: npm audit (fails on moderate or higher)
        run: cd web && npm audit --audit-level=moderate
      - run: cd web && npx eslint src && npm run build

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: cd mobile && flutter pub get && flutter analyze --no-fatal-infos && flutter test
      - name: Known vulnerabilities in Dart/Flutter packages (OSV)
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.1
        with:
          scan-args: --lockfile=mobile/pubspec.lock

  # Test APK for the pilot (debug-signed unless the store key is provided as secrets). Download it from the run's artifacts.
  mobile-apk:
    runs-on: ubuntu-latest
    needs: mobile
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}   # secrets cannot be used directly in step conditions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Store signing key (optional)
        if: env.HAS_KEY == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > mobile/android/upload.jks
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' "$PWD/mobile/android/upload.jks" "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" "${{ secrets.ANDROID_KEY_PASSWORD }}" > mobile/android/key.properties
      - run: cd mobile && flutter build apk --release --obfuscate --split-debug-info=build/symbols --dart-define=ALLOW_SERVER_CHANGE=true --dart-define=API_URL=${{ vars.STAGING_URL || 'https://staging.example.com' }}
      - uses: actions/upload-artifact@v4
        with: { name: fuelup-driver-test-apk, path: mobile/build/app/outputs/flutter-apk/app-release.apk, retention-days: 30 }

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  codeql:
    runs-on: ubuntu-latest
    strategy:
      matrix: { language: [csharp, javascript-typescript] }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: "${{ matrix.language }}", queries: security-extended }
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fuelup-api backend && docker build -t fuelup-web web
      - name: Image vulnerabilities (fails on HIGH/CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: fuelup-api, severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1" }
      - uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: fuelup-web, severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1" }
