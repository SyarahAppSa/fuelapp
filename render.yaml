# Render Blueprint — one web service (API + dashboard) + managed PostgreSQL + persistent disk for photos and keys.
# Cheapest production-capable setup: Starter web service + Basic-256mb Postgres + 1 GB disk.
services:
  - type: web
    name: fuelup
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    plan: starter
    region: frankfurt                 # closest Render region to Saudi Arabia (no Saudi region on Render)
    healthCheckPath: /health/ready
    autoDeploy: false                 # deploy on purpose, not on every push
    disk:
      name: fuelup-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: App__Environment
        value: production
      - key: App__Version
        value: 1.0.2
      - key: Jwt__Key
        generateValue: true           # random secret generated by Render, never in the code
      - key: Database__Host
        fromDatabase: { name: fuelup-db, property: host }
      - key: Database__Port
        fromDatabase: { name: fuelup-db, property: port }
      - key: Database__Name
        fromDatabase: { name: fuelup-db, property: database }
      - key: Database__User
        fromDatabase: { name: fuelup-db, property: user }
      - key: Database__Password
        fromDatabase: { name: fuelup-db, property: password }
      - key: Database__AppRole
        value: ""
      - key: Proxy__TrustedNetworks   # Render's own proxy in front; client IP = right-most X-Forwarded-For entry
        value: 0.0.0.0/0,::/0
      - key: Proxy__ForwardLimit
        value: "1"
      - key: Seed__Demo
        value: "false"
      - key: Bootstrap__CompanyName   # first start only: creates the first company and its admin — remove afterwards
        sync: false
      - key: Bootstrap__AdminUsername
        sync: false
      - key: Bootstrap__AdminPassword
        sync: false
      - key: Alerts__WebhookUrl
        sync: false

databases:
  - name: fuelup-db
    databaseName: fuelup
    user: fuelup
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []                   # no access from the internet; only the web service reaches it
