# Staging overlay: same images and settings as production, plus test data and a plain-HTTP preview port for testers.
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml --env-file .env.staging up -d
# Never use this overlay in production.
services:
  api:
    environment:
      App__Environment: staging
      Seed__Demo: "true"
      Seed__AllowInProduction: "true"
      Cors__Origins__1: http://localhost:8088
  web:
    ports: ["8088:8088"]
    volumes:
      - ./deploy/nginx-preview.conf:/etc/nginx/conf.d/preview.conf:ro
      - ./deploy/driver-web:/usr/share/nginx/html/driver:ro      # browser build of the driver app (flutter build web)
